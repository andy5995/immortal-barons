name: Homebrew formula

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Only when the formula or the build it drives changes. Nothing here checks the
# game itself -- ci.yml does that -- so there is no reason to run it for a
# change under internal/ that leaves the build files alone.
on:
  workflow_dispatch:
  # A publish is the moment the formula goes stale: the release exists and the
  # pin still names the one before it. Nothing pushes a commit then, so without
  # this the pin check would not run until the next unrelated change.
  release:
    types: [ published ]
  push:
    branches: [ trunk ]
    paths: &shared_paths
      - 'HomebrewFormula/**'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - '.github/workflows/homebrew.yml'

  pull_request:
    branches: [ trunk ]
    paths: *shared_paths

jobs:
  # The formula pins a published tarball by URL, so it can only be bumped after
  # a release exists -- which is what makes it easy to forget. It was, at v0.0.5
  # and again at v0.1.0, both times leaving the tap installing the previous
  # version with nothing failing. docs/dev/releasing.md carries the step; this
  # is the part that does not depend on anyone reading it.
  pin:
    name: formula pins the latest release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7

    - name: Compare the pinned tag against the latest release
      run: |
        pinned=$(sed -nE 's#.*releases/download/(v[^/]+)/.*#\1#p' \
                 HomebrewFormula/immortal-barons.rb | head -1)
        [ -n "$pinned" ] || { echo "::error::no release URL found in the formula"; exit 1; }
        latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
        if [ -z "$latest" ]; then
          echo "no published release yet; nothing to compare against"
          exit 0
        fi
        echo "formula pins $pinned; latest release is $latest"
        if [ "$pinned" != "$latest" ]; then
          echo "::error::the formula still pins $pinned but $latest is published." \
               "Bump url and sha256 in HomebrewFormula/immortal-barons.rb" \
               "(docs/dev/releasing.md, 'Bump the Homebrew formula')."
          exit 1
        fi

  formula:
    name: audit and install
    # A publish changes no files, so the macOS build has nothing new to test --
    # the pin job is the whole point of running on that event.
    if: github.event_name != 'release'
    runs-on: macos-latest
    env:
      # A plain "brew install --dry-run" will otherwise auto-update Homebrew
      # itself before doing anything.
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
    - uses: actions/checkout@v7

    # Homebrew refuses a formula that is not in a tap: install by path and by
    # URL are both rejected, and audit by path is disabled. Dropping the file
    # into Library/Taps is enough to make it "local/test/immortal-barons" -- no
    # brew tap-new needed. HomebrewFormula/ mirrors the layout in this repo,
    # which is itself a tap, so this checks the discovery rule we rely on.
    - name: Put the formula in a tap
      run: |
        TAP="$(brew --repository)/Library/Taps/local/homebrew-test"
        mkdir -p "$TAP/HomebrewFormula"
        cp HomebrewFormula/immortal-barons.rb "$TAP/HomebrewFormula/"
        echo "TAP=$TAP" >> "$GITHUB_ENV"
        brew info local/test/immortal-barons

    # brew style takes a path, but Homebrew's formula rules are keyed to a
    # directory named exactly Formula, so under HomebrewFormula/ the generic Ruby
    # cops apply. The formula is written to satisfy both sets.
    - name: Style
      run: brew style "$TAP/HomebrewFormula/immortal-barons.rb"

    # --online additionally checks that the url resolves; it is slower and can
    # be flaky, so it is left for the manual check before a release.
    - name: Audit
      run: brew audit --strict local/test/immortal-barons

    # Builds the vendored-source tarball the formula pins, which is what a user
    # would get. Use "brew install --HEAD local/test/immortal-barons" by hand to
    # build trunk instead.
    - name: Install from source
      run: brew install --build-from-source local/test/immortal-barons

    - name: Test
      run: brew test local/test/immortal-barons
