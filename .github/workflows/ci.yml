name: CI

on:
  push:
    branches: [trunk, main]
  pull_request:

# Concurrency block (Andy's convention): cancel superseded runs for the same
# PR / commit so only the latest is in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # gofmt is platform-independent, so run it once rather than on every OS.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt (must be clean)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  # Native build/test on each OS. This is what exercises the platform-specific
  # files (lock_unix.go / lock_windows.go) and the x/term console at runtime;
  # cross-compiling from one host cannot. go vet runs per-OS too, so each
  # build-tagged file is vetted on the platform it targets.
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # setup-go pinned to v6 (current, per Andy; DC has no Go workflow to
      # cross-check against). go-version-file keeps CI on the exact toolchain
      # the module declares (go.mod: go 1.26.x).
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  # The race detector guards the concurrent web-server model (one shared world
  # across sessions). It needs a C toolchain, so run it once on Linux rather
  # than across the matrix; ubuntu has gcc preinstalled.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test -race
        run: go test -race ./...
