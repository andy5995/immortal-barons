# po4a configuration for Immortal Barons docs + in-game help.
# The Markdown topics under internal/help/content are the single source
# of truth; po4a extracts English strings to po/help/<lang>.po and
# regenerates docs/help.<lang>/** per language. Frontmatter (title/etc.)
# is handled via the text module's YAML front-matter support; only the
# 'title' key is translated. po4a is a translation-time tool only — it is
# NOT a build or runtime dependency.

[po4a_paths] po/help/immortal-barons.pot de:po/help/de.po ru:po/help/ru.po

# regenerates a language's docs even while translation is partial;
# untranslated strings fall back to English. Raise it before a release if you
# want to withhold barely-started languages.

[type: text] internal/help/content/controls/interface.md $lang:internal/help/content.$lang/controls/interface.md opt:"-o markdown -o yfm_keys=title"
[type: text] internal/help/content/controls/numbers.md $lang:internal/help/content.$lang/controls/numbers.md opt:"-o markdown -o yfm_keys=title"
[type: text] internal/help/content/controls/turns.md $lang:internal/help/content.$lang/controls/turns.md opt:"-o markdown -o yfm_keys=title"
[type: text] internal/help/content/diplomacy/treaties.md $lang:internal/help/content.$lang/diplomacy/treaties.md opt:"-o markdown -o yfm_keys=title"
[type: text] internal/help/content/economy/banking.md $lang:internal/help/content.$lang/economy/banking.md opt:"-o markdown -o yfm_keys=title"
[type: text] internal/help/content/economy/food.md $lang:internal/help/content.$lang/economy/food.md opt:"-o markdown -o yfm_keys=title"
[type: text] internal/help/content/economy/industry.md $lang:internal/help/content.$lang/economy/industry.md opt:"-o markdown -o yfm_keys=title"
[type: text] internal/help/content/economy/net-worth.md $lang:internal/help/content.$lang/economy/net-worth.md opt:"-o markdown -o yfm_keys=title"
[type: text] internal/help/content/economy/regions.md $lang:internal/help/content.$lang/economy/regions.md opt:"-o markdown -o yfm_keys=title"
[type: text] internal/help/content/economy/taxes.md $lang:internal/help/content.$lang/economy/taxes.md opt:"-o markdown -o yfm_keys=title"
[type: text] internal/help/content/economy/trading.md $lang:internal/help/content.$lang/economy/trading.md opt:"-o markdown -o yfm_keys=title"
[type: text] internal/help/content/interbbs/leagues.md $lang:internal/help/content.$lang/interbbs/leagues.md opt:"-o markdown -o yfm_keys=title"
[type: text] internal/help/content/military/headquarters.md $lang:internal/help/content.$lang/military/headquarters.md opt:"-o markdown -o yfm_keys=title"
[type: text] internal/help/content/military/units.md $lang:internal/help/content.$lang/military/units.md opt:"-o markdown -o yfm_keys=title"
[type: text] internal/help/content/warfare/attacks.md $lang:internal/help/content.$lang/warfare/attacks.md opt:"-o markdown -o yfm_keys=title"
