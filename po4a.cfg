# Site docs (published on the website, not embedded in the game). Plain
# Markdown, no frontmatter. Translations are written by
# scripts/gen-help-translations.sh with -k 1, so an untranslated doc is simply
# omitted and the site falls back to English.
[type: text] README.md $lang:README.$lang.md opt:"-o markdown"
[type: text] docs/playing.md $lang:docs/playing.$lang.md opt:"-o markdown"
[type: text] docs/sysop-guide.md $lang:docs/sysop-guide.$lang.md opt:"-o markdown"
