; Immortal Barons installer data for Synchronet's install-xtrn.js
;
;   jsexec install-xtrn /path/to/immortal-barons-dir
;
; The start-up directory defaults to this file's own directory, so unpack the
; release archive under Synchronet's xtrn directory and point the installer at
; it. The game finds its "data" folder beside the binary, which keeps the
; command line well under Synchronet's 100-character limit.

Name: Immortal Barons
Desc: Interplanetary empire strategy game, a clone of Barren Realms Elite
By:   Andy Alt
Cats: Games
Subs: Strategy, Multiplayer, Native
Inst: 2026/08/20

[prog:IMBARONS]
name = Immortal Barons
cmd  = immortal-barons%. -dropfile %f
type = XTRN_DOOR32
settings = XTRN_MULTIUSER|XTRN_NATIVE|XTRN_LWRCASE
required = true
note = Before the first caller: run "immortal-barons -set-dropfile" and answer DOOR32.SYS, then "immortal-barons -reset" to create the game. The door will not start until both are done.

[event:IMBMAINT]
name = Immortal Barons maintenance
cmd  = immortal-barons%. -maint
settings = XTRN_NATIVE
days = 127
; time is minutes past midnight
time = 30
note = Required on a league board: -maint also runs the inter-BBS step, including the FTN mail set up in bbs.cfg, which a login does not, so run it as often as you want packets to move. On a board that plays alone it is optional, because maintenance also runs the first time someone plays on a new day.
